  "python-dotenv>=1.0,<2",
  "uvicorn>=0.34,<1",
  "starlette>=0.45,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

